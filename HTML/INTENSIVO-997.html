<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Preço do Silêncio, Protótipo Executivo · Dany Rocha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800;900&family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1F3D; --navy2:#123059; --navy0:#04101f;
  --gold:#C9A24A; --gold2:#F0DA9E; --gold3:#8f6f28;
  --white:#F6F2E8; --red:#D23B2E; --green:#4CAF7D;
  --serif:'Playfair Display',serif; --sans:'Oswald',sans-serif; --body:'Inter',sans-serif; --deco:'Cinzel',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020810;font-family:var(--body);color:var(--white);overflow:hidden}
#shell{position:fixed;inset:0;display:flex;align-items:stretch}
#app{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
#stageWrap{transform-origin:center center}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;border-radius:6px;
 background:
  radial-gradient(120% 95% at 50% 0%,rgba(38,74,130,.5) 0%,transparent 55%),
  radial-gradient(130% 130% at 50% 45%,var(--navy2) 0%,var(--navy) 46%,var(--navy0) 100%);
 box-shadow:0 40px 120px rgba(0,0,0,.75)}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
 box-shadow:inset 0 0 190px rgba(2,8,18,.72)}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease;transform:scale(.985);
 display:flex;flex-direction:column;justify-content:center;padding:64px 84px;z-index:1}
.slide.on{opacity:1;pointer-events:auto;transform:scale(1)}
/* modo de exportacao pra PDF: empilha todos os slides como paginas, um por vez */
body.printExport #hud,body.printExport #side,body.printExport #dbg,body.printExport #dust,
body.printExport #pwGate,body.printExport #fsExit{display:none!important}
body.printExport,body.printExport html{height:auto!important;overflow:visible!important}
body.printExport #shell{position:static!important;inset:auto;height:auto;display:block;padding:0}
body.printExport #app{height:auto;display:block}
body.printExport #stageWrap{transform:none!important;width:1280px;margin:0}
body.printExport #stage{width:1280px;height:auto;box-shadow:none;border-radius:0;overflow:visible}
body.printExport .slide{position:relative;inset:auto;opacity:1!important;pointer-events:none;transform:none!important;
 width:1280px;height:720px;overflow:hidden;page-break-after:always;break-after:page}
/* o conteudo interno so aparece via animacoes disparadas por ".slide.on X",
   e elas nao re-disparam de forma confiavel quando a classe on e adicionada
   depois da hidratacao. Pra exportar, ignora as animacoes e forca visivel. */
body.printExport .slide *{animation:none!important;opacity:1!important}
@page{size:13.333in 7.5in;margin:0}
/* moldura dupla premium */
.frame{position:absolute;inset:24px;border:1px solid rgba(201,162,74,.55);border-radius:3px;pointer-events:none;z-index:4}
.frame:before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,162,74,.20);border-radius:2px}
.frame:after{content:"◈";position:absolute;top:-10px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:13px;text-shadow:0 0 12px rgba(201,162,74,.9)}
.corner{position:absolute;width:300px;height:300px;pointer-events:none;opacity:.3;z-index:0;
 background:repeating-radial-gradient(circle at 0 0,transparent 0 26px,rgba(201,162,74,.4) 26px 27px,transparent 27px 54px)}
.corner.tl{top:-70px;left:-70px}
.corner.br{bottom:-70px;right:-70px;transform:rotate(180deg)}
.chev{color:var(--gold);letter-spacing:.35em;font-family:var(--sans);opacity:.85;text-shadow:0 0 14px rgba(201,162,74,.6)}
.kick{font-family:var(--deco);letter-spacing:.5em;color:var(--gold);font-size:14px;font-weight:600;text-transform:uppercase}
.kickSeg{font-size:23px;letter-spacing:.42em;padding:9px 26px;border:1px solid rgba(201,162,74,.55);border-radius:34px;
 background:linear-gradient(180deg,rgba(201,162,74,.14),rgba(201,162,74,.04));box-shadow:0 6px 22px rgba(201,162,74,.15);margin-bottom:4px}
h1,h2{line-height:1.1;font-weight:700}
h1{font-size:44px}
.serif{font-family:var(--serif)}
.sans{font-family:var(--sans);text-transform:uppercase;font-weight:600;letter-spacing:.015em}
.g{background:linear-gradient(180deg,var(--gold2) 8%,#DDBE74 40%,var(--gold) 62%,var(--gold3) 100%);
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 2px 10px rgba(201,162,74,.3))}
.red{color:var(--red)} .gr{color:var(--green)}
.big{font-size:60px}.huge{font-size:76px}.med{font-size:44px}.small{font-size:32px}
.divider-line{height:1px;width:220px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;box-shadow:0 0 14px rgba(201,162,74,.5)}
.los{color:var(--gold);text-align:center;font-size:13px;margin:10px 0;text-shadow:0 0 12px rgba(201,162,74,.9)}
.two{display:grid;grid-template-columns:1.08fr .92fr;gap:44px;align-items:center;height:100%}
.two.rev{grid-template-columns:.92fr 1.08fr}
.center{text-align:center}
.txtL{max-width:640px}
.photoWrap{height:540px;display:flex;align-items:center;justify-content:center}
.photo{width:100%;height:100%;border-radius:12px;background-size:cover;background-position:center 18%;background-color:#0c1a2e;background-repeat:no-repeat;
 border:1px solid rgba(201,162,74,.85);outline:1px solid rgba(201,162,74,.25);outline-offset:6px;
 box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04)}
.bullets{list-style:none;margin-top:16px}
.bigQuoteWrap{position:relative;display:inline-block;padding-left:34px}
.bigQuoteMark{position:absolute;left:-8px;top:-30px;font-family:var(--serif);font-size:68px;color:rgba(201,162,74,.55);line-height:1}
.flagRow{display:flex;gap:14px;margin-top:16px}
.flagChip{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(201,162,74,.5);border-radius:20px;
 padding:7px 16px;font-family:var(--sans);font-size:13px;letter-spacing:.06em;color:#dfe7f2;
 background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012))}
.flagChip b{color:var(--gold2);font-weight:600}
.semRow{display:flex;justify-content:center;gap:26px;margin-top:32px;flex-wrap:wrap}
.semItem{display:flex;flex-direction:column;align-items:center;gap:12px;width:210px;padding:22px 16px;
 border:1px solid rgba(201,162,74,.4);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
 box-shadow:inset 0 0 26px rgba(201,162,74,.04);opacity:0}
.semItem .itIco{width:32px;height:32px;filter:drop-shadow(0 3px 10px rgba(201,162,74,.4))}
.semItem span{font-size:15px;font-weight:300;color:#E9EDF5;line-height:1.4;text-align:center}
.semItem span b{color:var(--gold2);font-weight:600}
.slide.on .semItem{animation:riseS .55s both}
.slide.on .semItem:nth-child(1){animation-delay:.4s}.slide.on .semItem:nth-child(2){animation-delay:.52s}.slide.on .semItem:nth-child(3){animation-delay:.64s}
.icoGrid.oddlast>.iconItem:last-child{grid-column:1/-1;justify-self:center;max-width:494px;width:100%}
/* ===== comparação preço do silêncio (slide "O PREÇO?") ===== */
.priceCompare{display:grid;grid-template-columns:1fr auto 1fr;gap:44px;margin-top:30px;align-items:start;max-width:1480px;margin-left:auto;margin-right:auto}
.pcDividerBig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-top:56px}
.pcDividerBig .arrow{font-size:34px;color:var(--gold);text-shadow:0 0 22px rgba(201,162,74,.7)}
.pcDividerBig span{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:24px;text-shadow:0 0 20px rgba(201,162,74,.55)}
.pcClose{margin-top:36px;text-align:center;font-family:var(--serif);font-style:italic;font-size:25px;color:var(--gold2);
 max-width:900px;margin-left:auto;margin-right:auto;line-height:1.5}
.pcCol{display:flex;flex-direction:column;gap:14px}
.pcColTitle{font-family:var(--sans);font-size:14px;letter-spacing:.14em;color:#93a6c2;margin-bottom:8px;text-transform:uppercase;text-align:left}
.pcColTitle.gold{color:var(--gold)}
.pcItem{display:flex;gap:16px;align-items:flex-start;text-align:left;opacity:0}
.pcItem .itIco{width:30px;height:30px;flex:0 0 30px;filter:grayscale(.35);opacity:.75;margin-top:2px}
.pcItem b{display:block;font-family:var(--sans);font-size:16.5px;color:#c7d2e2;letter-spacing:.03em;font-weight:600}
.pcItem span{display:block;font-size:14px;color:#8497b3;font-weight:300;margin-top:4px;line-height:1.46}
.pcDivider{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--gold);font-size:20px;opacity:.65;padding-top:40px}
.pcCardBig{display:flex;gap:16px;align-items:flex-start;text-align:left;border:1px solid rgba(201,162,74,.55);border-radius:16px;padding:19px 22px;
 background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:inset 0 0 28px rgba(201,162,74,.06),0 10px 26px rgba(0,0,0,.25);opacity:0}
.pcCardBig .itIco{width:32px;height:32px;flex:0 0 32px;margin-top:1px}
.pcCardBig b{display:block;font-family:var(--sans);font-size:18px;color:#EDEFF4;letter-spacing:.02em;font-weight:600}
.pcCardBig span{display:block;font-size:14.5px;color:#b8c4d8;font-weight:300;margin-top:4px;line-height:1.46}
.slide.on .pcItem{animation:riseS .5s both}
.slide.on .pcItem:nth-child(2){animation-delay:.4s}.slide.on .pcItem:nth-child(3){animation-delay:.5s}
.slide.on .pcItem:nth-child(4){animation-delay:.6s}.slide.on .pcItem:nth-child(5){animation-delay:.7s}
.slide.on .pcCardBig{animation:riseS .5s both}
.slide.on .pcCardBig:nth-child(2){animation-delay:.5s}.slide.on .pcCardBig:nth-child(3){animation-delay:.62s}.slide.on .pcCardBig:nth-child(4){animation-delay:.74s}
.stackRowVal{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed rgba(201,162,74,.35);
 padding:9px 0;font-family:var(--sans);font-size:16px;color:#cdd8e8}
.stackRowVal:last-child{border-bottom:none}
.stackRowVal b{font-family:var(--sans);font-size:20px;white-space:nowrap}
.condTag{display:inline-block;margin-top:18px;font-family:var(--sans);letter-spacing:.14em;font-size:13px;
 color:var(--red);border:1px solid rgba(210,59,46,.55);border-radius:20px;padding:8px 20px;background:rgba(210,59,46,.08)}
/* valor duplo: dolar pequeno primeiro, reais grande embaixo */
.valDual{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:auto;align-self:center;white-space:nowrap}
.valDual small{font-family:var(--sans);color:#93a6c2;font-size:12px;letter-spacing:.05em}
.valDual b{font-family:var(--sans);font-size:20px}
/* selo circular do icone nos cards de oferta (cards mais palpaveis) */
.icoBadge{width:48px;height:48px;border-radius:50%;flex:0 0 48px;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 35% 30%,rgba(240,218,158,.28),rgba(201,162,74,.06));
 border:1.5px solid rgba(201,162,74,.7);box-shadow:0 4px 16px rgba(0,0,0,.4),inset 0 0 14px rgba(201,162,74,.18)}
.icoBadge .itIco{width:24px;height:24px}
.offerCard{border-width:1.5px;box-shadow:inset 0 0 34px rgba(201,162,74,.1),0 14px 34px rgba(0,0,0,.35)}
/* X grande com efeito sobre o preco riscado (reaproveita a animacao xstamp) */
.priceXWrap{position:relative;display:inline-block}
.priceXWrap:after{content:"✕";position:absolute;inset:-12% -8%;display:flex;align-items:center;justify-content:center;
 font-size:var(--xsize,120px);color:var(--red);opacity:.92;font-weight:900;pointer-events:none;z-index:3;
 transform:rotate(-9deg);text-shadow:0 0 44px rgba(210,59,46,.55),4px 4px 0 rgba(120,15,8,.4)}
.slide.on .priceXWrap:after{animation:xstamp .5s .35s both}
/* qr mini no canto do slide de entregaveis */
.qrMini{position:absolute;top:18px;right:24px;width:112px;z-index:6;text-align:center}
.qrMini svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 22px rgba(0,0,0,.5))}
.qrMini .qrCap{display:block;margin-top:4px;font-family:var(--sans);font-size:9px;letter-spacing:.12em;color:#93a6c2}
/* ---- PROPOSTA DIFERENCIADA: replica exata da referencia do Fernando ---- */
.propGrid{display:grid;grid-template-columns:345px 1fr 327px;gap:17px;width:1200px;max-width:none;
 height:507px;margin:16px -100px 0;align-items:stretch;text-align:left}
.propCard{border:1px solid rgba(201,162,74,.5);border-radius:14px;
 background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
 box-shadow:inset 0 0 40px rgba(201,162,74,.06),0 12px 30px rgba(0,0,0,.4)}
/* coluna 1: preco */
.propPrice{display:flex;flex-direction:column;justify-content:center;padding:28px 26px}
.propLab{font-family:var(--sans);font-size:15px;letter-spacing:.14em;color:#e8eef7}
.propFrom{font-family:var(--serif);font-size:54px;font-weight:800;line-height:1.05;display:inline-block;
 margin:6px 0 2px;white-space:nowrap}
.propConv{font-family:var(--sans);font-size:17px;letter-spacing:.03em;color:#9fb0c8}
.propNow{font-family:var(--serif);font-size:62px;font-weight:800;line-height:1.02;color:#3FD37F;
 text-shadow:0 0 34px rgba(63,211,127,.45);display:block;margin-top:4px;white-space:nowrap}
.propNowSub{font-family:var(--sans);font-size:19px;letter-spacing:.02em;color:#3FD37F;margin-top:2px}
.propInstal{font-family:var(--sans);font-size:15px;letter-spacing:.02em;color:#9fb0c8}
/* minicard verde do parcelamento, mais chamativo que o a vista */
.instalCard{display:inline-flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:6px;padding:7px 16px;border-radius:12px;
 border:1.5px solid rgba(63,211,127,.8);background:linear-gradient(180deg,rgba(63,211,127,.18),rgba(63,211,127,.05));
 box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 0 18px rgba(63,211,127,.1)}
.instalCard span{font-family:var(--sans);font-size:12.5px;color:#bdf0d6;letter-spacing:.02em}
.instalCard b{font-family:var(--serif);font-size:24px;font-weight:800;color:#3FD37F;text-shadow:0 0 16px rgba(63,211,127,.45)}
/* risco vermelho reto por cima do valor */
.propStrike{position:relative;display:inline-block}
.propStrike:after{content:"";position:absolute;left:-5%;right:-5%;top:52%;height:5px;border-radius:3px;
 background:linear-gradient(90deg,#e8503f,#c0281c);transform:rotate(-7deg);
 box-shadow:0 0 14px rgba(210,59,46,.55);pointer-events:none}
.slide.on .propStrike:after{animation:xstamp .45s .5s both}
.propStrikeX:before{content:"\2715";position:absolute;right:-26px;top:50%;transform:translateY(-52%);
 color:var(--red);font-size:30px;font-weight:900;text-shadow:0 0 16px rgba(210,59,46,.6);pointer-events:none}
/* divisor fino com losango */
.propDiv{display:flex;align-items:center;gap:9px;margin:11px 0}
.propDiv:before,.propDiv:after{content:"";flex:1;height:1px;background:rgba(201,162,74,.38)}
.propDiv i{font-style:normal;color:var(--gold);font-size:9px}
/* coluna 2: pilares */
.propPil{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:205px 205px 1fr;gap:18px 15px}
.propPilCard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:12px 14px 12px}
.propPilLab{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
 font-family:var(--sans);font-size:12.5px;letter-spacing:.2em;color:var(--gold)}
.propPilLab:before,.propPilLab:after{content:"";width:28px;height:1px}
.propPilLab:before{background:linear-gradient(90deg,transparent,rgba(201,162,74,.85))}
.propPilLab:after{background:linear-gradient(90deg,rgba(201,162,74,.85),transparent)}
.propPilCard img,.propPilCard svg.pArt{width:66px;height:66px;object-fit:contain;
 filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.propPilCard b{font-family:var(--sans);font-size:21px;font-weight:500;color:#F6F2E8;letter-spacing:.01em;line-height:1.15}
.propPilCard span{font-family:var(--body);font-size:12.5px;font-weight:300;color:#a9b8cc;line-height:1.3}
.propJor{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:16px;padding:7px 20px}
.propJor .itIco{width:32px;height:32px;flex:0 0 32px}
.propJor b{display:block;font-family:var(--sans);font-size:21px;font-weight:500;color:#F6F2E8;line-height:1.2}
.propJor span{font-family:var(--body);font-size:16px;font-weight:300;color:#a9b8cc}
/* coluna 3: bonus */
/* mesmas linhas da grade dos pilares, pra os bonus alinharem com eles.
   O titulo sai do fluxo pra nao empurrar o bonus 1 pra baixo da linha do pilar. */
.propBon{position:relative;display:grid;grid-template-rows:205px 205px 1fr;gap:18px}
.propBonTit{position:absolute;top:-32px;left:0;right:0;
 font-family:var(--sans);font-size:19px;font-weight:600;letter-spacing:.09em;color:#3FD37F;text-align:center}
.propBonCard2{grid-row:2/4}
.propBonCard{position:relative;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:16px 20px;
 border:1px solid rgba(76,175,125,.6);border-radius:14px;
 background:linear-gradient(180deg,rgba(63,211,127,.07),rgba(63,211,127,.012));
 box-shadow:inset 0 0 40px rgba(63,211,127,.05),0 12px 30px rgba(0,0,0,.4)}
.propBonTag{align-self:flex-start;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.1em;
 color:#052a17;background:linear-gradient(180deg,#6fe0a4,#3FD37F);border-radius:20px;padding:4px 14px;margin-bottom:14px}
.propBonRow{display:flex;align-items:center;gap:15px}
.propBonIco{width:62px;height:62px;flex:0 0 62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 border:1.5px solid rgba(76,175,125,.75);background:radial-gradient(circle at 35% 30%,rgba(63,211,127,.18),rgba(63,211,127,.02))}
.propBonIco .itIco{width:30px;height:30px}
.propBonRow p{font-family:var(--sans);font-size:19px;font-weight:500;color:#F6F2E8;line-height:1.28;margin:0}
.propBonVal{font-family:var(--sans);font-size:19px;color:#c9d4e3;align-self:flex-start}
/* ---- CTA final: resumo da oferta em lista + preco, com o QR do lado ---- */
.ctaList{display:flex;flex-direction:column;gap:5px;margin:8px 0 10px}
.ctaLi{display:flex;align-items:center;gap:11px;padding:3px 12px;border-radius:10px;
 border:1px solid rgba(201,162,74,.28);background:rgba(255,255,255,.028)}
.ctaLi .itIco{width:19px;height:19px;flex:0 0 19px}
.ctaLi span{flex:1;font-family:var(--sans);font-size:15px;font-weight:400;color:#e9eef6;letter-spacing:.01em}
.ctaLi b{font-family:var(--sans);font-size:14px;font-weight:600;color:#8fa2ba;position:relative;display:inline-block}
.ctaLi.bon{border-color:rgba(76,175,125,.45);background:rgba(63,211,127,.05)}
.ctaLi.bon span{color:#bdf0d6}
.ctaPrice{display:flex;align-items:baseline;flex-wrap:wrap;gap:14px;margin-bottom:4px}
.ctaFrom{font-family:var(--serif);font-size:30px;font-weight:800;position:relative;display:inline-block}
.ctaNow{font-family:var(--serif);font-size:52px;font-weight:800;color:#3FD37F;line-height:1;
 text-shadow:0 0 30px rgba(63,211,127,.45);white-space:nowrap}
.ctaBr{font-family:var(--sans);font-size:19px;font-weight:600;color:#3FD37F}
.ctaInst{font-family:var(--sans);font-size:14.5px;color:#9fb0c8;letter-spacing:.02em;margin-bottom:8px}
/* valores por entrega no slide dos pilares + barra de total */
.pilVal{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--gold2);letter-spacing:.03em;margin-top:auto;padding-top:6px}
.jorVal{position:absolute;top:14px;right:26px;font-family:var(--sans);font-size:18px;font-weight:600;color:var(--gold2)}
.totalBar{display:flex;align-items:center;justify-content:space-between;width:1180px;max-width:none;
 margin:12px -90px 0;border:1.5px solid rgba(201,162,74,.8);border-radius:14px;padding:10px 28px;
 background:linear-gradient(180deg,rgba(201,162,74,.12),rgba(201,162,74,.02))}
.totalBar b{font-family:var(--sans);font-size:19px;letter-spacing:.12em;color:#F6F2E8}
.totalBar em{font-style:normal;font-family:var(--serif);font-size:34px;font-weight:800}

/* ===================== MOTION & LIGHT FX ===================== */
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes riseS{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:scale(.82)}60%{opacity:1;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1) translateY(-6px)}}
@keyframes shimmer{from{background-position:220% 0,0 0}to{background-position:-220% 0,0 0}}
@keyframes dustf{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.85}85%{opacity:.4}100%{transform:translateY(-160px) translateX(14px);opacity:0}}
@keyframes glowp{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes aur{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.07)}}
@keyframes xstamp{0%{opacity:0;transform:scale(2.4) rotate(-10deg)}55%{opacity:.95;transform:scale(.93) rotate(-10deg)}100%{opacity:.88;transform:scale(1) rotate(-10deg)}}
#stage:before{content:"";position:absolute;inset:-22%;z-index:0;pointer-events:none;
 background:radial-gradient(38% 30% at 28% 18%,rgba(201,162,74,.09),transparent 62%),
            radial-gradient(34% 28% at 72% 82%,rgba(64,110,180,.12),transparent 62%);
 animation:aur 14s ease-in-out infinite alternate}
#dust{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#dust span{position:absolute;bottom:-12px;border-radius:50%;
 background:radial-gradient(circle,#F5E7B6 0%,rgba(201,162,74,.55) 45%,rgba(201,162,74,0) 72%);
 animation:dustf linear infinite;filter:blur(.4px)}
/* revelação em cascata (só no slide ativo) */
.slide .kick,.slide .pill,.slide h1,.slide p,.slide .bullets li,.slide .btnGold,.slide .bonusBox,
.slide .photoWrap,.slide .phWrap,.slide .cardRow>*,.slide .stackRow,.slide .divider-line,.slide .los,
.slide .chev,.slide .miniPhoto,.slide .redX{opacity:0}
.slide.on .kick{animation:rise .55s .05s both}
.slide.on .pill{animation:popin .5s .12s both}
.slide.on h1{animation:rise .7s .18s both}
.slide.on .los,.slide.on .divider-line{animation:rise .5s .34s both}
.slide.on p{animation:rise .6s .4s both}
.slide.on .chev{animation:rise .55s .55s both}
.slide.on .bullets li{animation:rise .5s both}
.slide.on .bullets li:nth-child(1){animation-delay:.42s}.slide.on .bullets li:nth-child(2){animation-delay:.5s}
.slide.on .bullets li:nth-child(3){animation-delay:.58s}.slide.on .bullets li:nth-child(4){animation-delay:.66s}
.slide.on .bullets li:nth-child(5){animation-delay:.74s}.slide.on .bullets li:nth-child(6){animation-delay:.82s}
.slide.on .bullets li:nth-child(7){animation-delay:.9s}.slide.on .bullets li:nth-child(8){animation-delay:.98s}
.slide.on .bullets li:nth-child(9){animation-delay:1.06s}
.slide.on .photoWrap,.slide.on .phWrap{animation:riseS .75s .28s both}
.slide.on .cardRow>*{animation:riseS .55s both}
.slide.on .cardRow>*:nth-child(1){animation-delay:.38s}.slide.on .cardRow>*:nth-child(2){animation-delay:.54s}
.slide.on .cardRow>*:nth-child(3){animation-delay:.7s}.slide.on .cardRow>*:nth-child(4){animation-delay:.86s}
.slide.on .stackRow{animation:rise .55s both}
.slide.on .stackRow:nth-of-type(1){animation-delay:.35s}.slide.on .stackRow:nth-of-type(2){animation-delay:.5s}
.slide.on .stackRow:nth-of-type(3){animation-delay:.65s}.slide.on .stackRow:nth-of-type(4){animation-delay:.8s}
.slide.on .btnGold{animation:popin .55s .8s both}
.slide.on .bonusBox{animation:rise .6s .65s both}
.slide.on .miniPhoto{animation:riseS .6s .6s both;opacity:0}
.slide.on .redX{animation:xstamp .55s .85s both}
/* Ken Burns nas fotos + brilho pulsante nos pódios */
.photoWrap{overflow:visible}
.slide.on .photo{animation:riseS .01s .28s both, kb 18s 1s ease-out forwards}
.slide.on .podium:after{animation:glowp 3.2s 1.3s ease-in-out infinite}
/* shimmer dourado varrendo os títulos */
.g{background:linear-gradient(115deg,rgba(255,250,225,0) 42%,rgba(255,248,214,.9) 50%,rgba(255,250,225,0) 58%),
   linear-gradient(180deg,var(--gold2) 8%,#DDBE74 40%,var(--gold) 62%,var(--gold3) 100%);
 background-size:240% 100%,100% 100%;background-position:220% 0,0 0;
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 2px 10px rgba(201,162,74,.3))}
.slide.on .g{animation:shimmer 2.6s 1.05s ease-in-out 1 both}
.slide.on h1 .g{animation:shimmer 2.6s 1.05s ease-in-out 1 both}
/* ===== CAPA HERO: foto sangrada na metade direita ===== */
.heroTxt{position:relative;z-index:2;max-width:585px;height:100%;display:flex;flex-direction:column;justify-content:center}
.heroPhoto{position:absolute;top:0;right:0;bottom:0;width:50%;z-index:1;background-size:cover;background-position:center 12%;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%);mask-image:linear-gradient(90deg,transparent 0,#000 18%);
 box-shadow:inset 0 -120px 140px -60px rgba(4,16,31,.9)}
.heroPhoto:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,16,31,.55) 0%,transparent 30%),
 radial-gradient(60% 50% at 70% 30%,rgba(201,162,74,.10),transparent 70%)}
@keyframes heroIn{from{opacity:0;transform:translateX(70px) scale(1.05)}to{opacity:1;transform:none}}
.slide .heroPhoto{opacity:0}
.slide.on .heroPhoto{animation:heroIn 1.15s .2s cubic-bezier(.22,.9,.3,1) both}
/* nitidez/vida nas fotos sangradas (anti-fosco) */
.heroPhoto,.edgePhoto{filter:contrast(1.1) saturate(1.16) brightness(1.05)}
.heroPhoto:after{background:linear-gradient(0deg,rgba(4,16,31,.42) 0%,transparent 26%),
 radial-gradient(60% 50% at 70% 30%,rgba(201,162,74,.05),transparent 70%)}
/* ===== SISTEMA DE FOTO SANGRADA (4 direções) ===== */
.edgePhoto{position:absolute;z-index:1;background-size:cover;background-position:center 15%;background-repeat:no-repeat;opacity:0}
.edgePhoto:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,16,31,.42) 0%,transparent 30%),
 radial-gradient(60% 50% at 60% 25%,rgba(201,162,74,.05),transparent 70%)}
.edgePhoto.eR{top:0;right:0;bottom:0;width:50%;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%);mask-image:linear-gradient(90deg,transparent 0,#000 18%)}
.edgePhoto.eL{top:0;left:0;bottom:0;width:50%;
 -webkit-mask-image:linear-gradient(270deg,transparent 0,#000 18%);mask-image:linear-gradient(270deg,transparent 0,#000 18%)}
.edgePhoto.eT{top:0;left:0;right:0;height:54%;background-position:center 22%;
 -webkit-mask-image:linear-gradient(0deg,transparent 0,#000 24%);mask-image:linear-gradient(0deg,transparent 0,#000 24%)}
.edgePhoto.eB{bottom:0;left:0;right:0;height:54%;background-position:center 30%;
 -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 24%);mask-image:linear-gradient(180deg,transparent 0,#000 24%)}
@keyframes edgeR{from{opacity:0;transform:translateX(70px) scale(1.05)}to{opacity:1;transform:none}}
@keyframes edgeL{from{opacity:0;transform:translateX(-70px) scale(1.05)}to{opacity:1;transform:none}}
@keyframes edgeT{from{opacity:0;transform:translateY(-60px) scale(1.05)}to{opacity:1;transform:none}}
@keyframes edgeB{from{opacity:0;transform:translateY(60px) scale(1.05)}to{opacity:1;transform:none}}
@keyframes kbEdge{from{transform:scale(1)}to{transform:scale(1.06)}}
.slide.on .edgePhoto.eR{animation:edgeR 1.15s .2s cubic-bezier(.22,.9,.3,1) both,kbEdge 18s 1.6s ease-out forwards}
.slide.on .edgePhoto.eL{animation:edgeL 1.15s .2s cubic-bezier(.22,.9,.3,1) both,kbEdge 18s 1.6s ease-out forwards}
.slide.on .edgePhoto.eT{animation:edgeT 1.15s .2s cubic-bezier(.22,.9,.3,1) both,kbEdge 18s 1.6s ease-out forwards}
.slide.on .edgePhoto.eB{animation:edgeB 1.15s .2s cubic-bezier(.22,.9,.3,1) both,kbEdge 18s 1.6s ease-out forwards}
.heroTxt.tR{margin-left:auto;padding-left:24px}
.heroTxt.tB{height:auto;margin-top:auto;padding-bottom:8px;max-width:100%}
.heroTxt.tT{height:auto;margin-bottom:auto;padding-top:8px;max-width:100%}
/* ===== TEMA PRETO (toggle) ===== */
body.tblack{background:#000}
body.tblack #stage{background:
 radial-gradient(120% 95% at 50% 0%,rgba(84,76,58,.26) 0%,transparent 55%),
 radial-gradient(130% 130% at 50% 45%,#17171b 0%,#0b0b0e 46%,#000 100%)}
body.tblack #stage:before{background:
 radial-gradient(38% 30% at 28% 18%,rgba(201,162,74,.10),transparent 62%),
 radial-gradient(34% 28% at 72% 82%,rgba(201,162,74,.06),transparent 62%)}
body.tblack .heroPhoto:after,body.tblack .edgePhoto:after{background:linear-gradient(0deg,rgba(0,0,0,.5) 0%,transparent 30%),

/* arte conceitual em meia tela */
.edgePhoto{background-color:rgba(10,25,48,.4)}
.edgePhoto.edgeArt{display:flex;align-items:center;justify-content:center;background:
 radial-gradient(60% 60% at 50% 48%,rgba(201,162,74,.12),transparent 72%),rgba(255,255,255,.015)}

/* grade de tópicos com ícones */
.icoGrid{display:grid;gap:14px;margin-top:22px;text-align:left}
.iconItem{display:flex;gap:14px;align-items:center;border:1px solid rgba(201,162,74,.42);border-radius:14px;padding:13px 17px;
 background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));box-shadow:inset 0 0 26px rgba(201,162,74,.04);opacity:0}
.iconItem .itIco{width:30px;height:30px;flex:0 0 30px;filter:drop-shadow(0 2px 8px rgba(201,162,74,.4))}

.iconItem span b{color:var(--gold2);font-weight:600}
/* variante "bigCards": cards maiores (mesmos ícones), usada nos slides 88/89/90/98 */

.icoGrid.bigCards .iconItem{padding:24px 28px;border-radius:18px;gap:20px}
.icoGrid.bigCards .iconItem .itIco{width:46px;height:46px;flex:0 0 46px}
.icoGrid.bigCards .iconItem span{font-size:19.5px;line-height:1.42}

.slide.on .iconItem{animation:riseS .5s both}
.slide.on .iconItem:nth-child(1){animation-delay:.38s}.slide.on .iconItem:nth-child(2){animation-delay:.44s}
.slide.on .iconItem:nth-child(3){animation-delay:.5s}.slide.on .iconItem:nth-child(4){animation-delay:.56s}
.slide.on .iconItem:nth-child(5){animation-delay:.62s}.slide.on .iconItem:nth-child(6){animation-delay:.68s}
.slide.on .iconItem:nth-child(7){animation-delay:.74s}.slide.on .iconItem:nth-child(8){animation-delay:.8s}
.slide.on .iconItem:nth-child(9){animation-delay:.86s}

<script>
(function(){
  var HASH='d0eea09126f13844e0048842e86fdddd3245f3cba6b4e262a9a4d38fb789f0ae';
  var KEY='pds_auth';
  function unlock(){document.body.classList.add('pw-ok');}
  if(sessionStorage.getItem(KEY)===HASH||localStorage.getItem(KEY)===HASH){unlock();return;}
  var gate=document.getElementById('pwGate');
  gate.addEventListener('keydown',function(e){e.stopPropagation();});
  gate.addEventListener('keyup',function(e){e.stopPropagation();});
  document.addEventListener('keydown',function(e){if(!document.body.classList.contains('pw-ok'))e.stopPropagation();});
  document.addEventListener('keyup',function(e){if(!document.body.classList.contains('pw-ok'))e.stopPropagation();});
  function sha256(t){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
  }
  function tryPw(){
    var v=document.getElementById('pwInput').value.trim();
    if(!v)return;
    sha256(v).then(function(h){
      if(h===HASH){
        if(document.getElementById('pwRemember').checked){localStorage.setItem(KEY,h);}
        else{sessionStorage.setItem(KEY,h);}
        unlock();
      }else{
        document.getElementById('pwErr').textContent='Senha incorreta. Tente novamente.';
        document.getElementById('pwInput').value='';
        document.getElementById('pwInput').focus();
      }
    });
  }
  document.getElementById('pwBtn').addEventListener('click',tryPw);
  document.getElementById('pwInput').addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
  document.getElementById('pwToggle').addEventListener('click',function(){
    var inp=document.getElementById('pwInput');
    var showing=inp.type==='text';
    inp.type=showing?'password':'text';
    this.textContent=showing?'👁':'🙈';
    this.title=showing?'Mostrar senha':'Ocultar senha';
    this.setAttribute('aria-label',this.title);
    inp.focus();
  });
  window.addEventListener('load',function(){document.getElementById('pwInput').focus();});
})();
</script>

    }
    { const n=SLIDES.indexOf(s)+1;

      } }

  if(L==='center'||L==='statement'||L==='divider'){

  }
  if(L==='segredos3'){
    return `<div style="margin:auto;width:100%"><h1 class="serif center" style="font-size:46px">${s.title}</h1><div class="cardRow" style="margin-top:22px">${s.cards.map((c,i)=>`<div class="podium"><div class="num">${i+1}</div><div class="divider-line" style="width:80px"></div><div style="font-family:var(--serif);font-size:20px;margin-top:6px">${c}</div></div>`).join('')}</div></div>`;
  }
  if(L==='prova'){
    const n=SLIDES.indexOf(s)+1;
    const body=PEOPLESTRIP[n]?namesStripHTML(PEOPLESTRIP[n]):printsRow(s.prints||3,n);
    return `<div style="margin:auto;width:100%" class="center">${title}${sub}${body}${s.foot?`<div class="divider-line"></div><div class="kick" style="letter-spacing:.14em">${s.foot}</div>`:''}</div>`;
  }
  if(L==='video'){
    const n=SLIDES.indexOf(s)+1;
    if(s.fullvid){ return `<div style="margin:auto;width:100%" class="center">${title}${fullVideoBox(n)}${extra}</div>`; }
    return `<div style="margin:auto;width:100%" class="center">${title}${sub}${videoRow(s.videos||2,s.vlabel,n)}${extra}</div>`;
  }
  if(L==='photostory'){
    const boxes=`<div style="display:flex;flex-direction:column;gap:12px">${s.boxes.map(b=>`<div style="border:1px solid rgba(201,162,74,.4);border-radius:12px;padding:14px 16px;font-family:var(--body);font-weight:300;font-size:18px;color:#eef2f8">${b}</div>`).join('')}</div>`;
    const med=media(s);
    return `<div class="two">${med}<div class="txtL">${title}${boxes}</div></div>`;
  }
  if(L==='xnegar'){
    const n=SLIDES.indexOf(s)+1;
    if(s.concept&&CEDGE[n]){
      const dir=CEDGE[n];const a=ART[s.concept]||ART['default'];const f=CFILE[n];
      const tcls=dir==='eB'?'tT':dir==='eT'?'tB':(dir==='eL'?'tR':'');
      const wide=(dir==='eB'||dir==='eT')?'style="max-width:100%;text-align:center"':'';
      return `<div class="edgePhoto edgeArt ${dir}">${a.svg}${OVERIMG(f,true,n)}<span class="edgeLab">${f||'CONCEITO'}</span></div><div class="heroTxt ${tcls}" ${wide}>${title}${sub}${fecho}</div>`;
    }
    const med=`<div class="phWrap" style="position:relative">${media(s)}<div class="redX">✕</div></div>`;
    const txt=`<div class="txtL">${title}${sub}${fecho}</div>`;
    return `<div class="two">${txt}${med}</div>`;
  }
  if(L==='stack'){
    return `<div style="margin:auto;width:100%;max-width:1040px">${title}<div style="margin-top:18px">${s.rows.map(r=>`<div class="stackRow"><div><b class="g sans">${r[0]}</b> <span style="color:#cdd8e8">${r[1]||''}</span></div><div class="v">${r[2]||''}</div></div>`).join('')}</div>${fecho}</div>`;
  }
  if(L==='cta'){
    const txt=`<div class="txtL">${title}${sub}${bullets}${extra}${btn}</div>`;
    return `<div class="two">${txt}<div class="phWrap">${media(s)}</div></div>`;
  }
  return `<div class="center" style="margin:auto">${title}${sub}</div>`;
}

/* ---------- engine ---------- */
let idx=0;
const stage=document.getElementById('stage');
/* ---- virtualizacao: so os slides vizinhos ficam montados no DOM ----
   Montar os 114 de uma vez custava ~87MB de download e centenas de MB de
   bitmaps decodificados; o Chrome do celular matava a aba (OOM) a cada
   relayout (girar a tela, dar zoom, abrir o roteiro). */
const HYD=new Set();
const HYD_WIN=1;
function slideHTML(s,i){
  return `<div class="corner tl"></div><div class="corner br"></div>${s.frame!==false?'<div class="frame"></div>':''}${SECBADGE[i+1]?`<div class="secBadge">◈&nbsp; ${SECBADGE[i+1]} &nbsp;◈</div>`:''}${render(s)}${s.note?`<div class="note">${s.note}</div>`:''}`;
}
/* rede instavel / hiccup momentaneo no CDN nao deveria deixar uma foto
   quebrada pra sempre: tenta de novo uma vez, com um parametro novo na
   URL pra nao reaproveitar uma resposta de erro que o navegador guardou
   em cache. */
function armImages(root){
  root.querySelectorAll('img').forEach(function(img){
    if(img.classList.contains('overImg')||img.dataset.armed)return;
    img.dataset.armed='1';
    img.addEventListener('error',function retry(){
      img.removeEventListener('error',retry);
      if(img.dataset.retried)return;
      img.dataset.retried='1';
      setTimeout(function(){
        try{const u=new URL(img.src,location.href);u.searchParams.set('r',Date.now()+'-'+Math.random().toString(36).slice(2));img.src=u.href;}catch(e){}
      },700);
    });
  });
  root.querySelectorAll('[style*="background-image"]').forEach(function(el){
    if(el.dataset.armed)return;
    el.dataset.armed='1';
    const m=/url\(["']?([^"')]+)["']?\)/.exec(el.style.backgroundImage);
    if(!m)return;
    const url=m[1];
    const probe=new Image();
    probe.onerror=function(){
      setTimeout(function(){
        try{
          const u=new URL(url,location.href);u.searchParams.set('r',Date.now()+'-'+Math.random().toString(36).slice(2));
          const retry=new Image();
          retry.onload=function(){el.style.backgroundImage="url('"+u.href+"')";};
          retry.src=u.href;
        }catch(e){}
      },700);
    };
    probe.src=url;
  });
}
function hydrate(i){
  if(HYD.has(i))return;
  const d=stage.children[i];if(!d)return;
  d.innerHTML=slideHTML(SLIDES[i],i);
  armImages(d);
  HYD.add(i);
}
function dehydrate(i){
  if(!HYD.has(i))return;
  const d=stage.children[i];if(!d)return;
  d.querySelectorAll('video').forEach(v=>{try{v.pause();v.removeAttribute('src');v.load();}catch(e){}});
  d.innerHTML='';
  HYD.delete(i);
}
function syncHydration(n){
  const keep=new Set();
  for(let k=n-HYD_WIN;k<=n+HYD_WIN;k++){if(k>=0&&k<SLIDES.length)keep.add(k);}
  keep.forEach(hydrate);
  [...HYD].forEach(k=>{if(!keep.has(k))dehydrate(k);});
}
function build(){
  stage.innerHTML='';
  SLIDES.forEach((s,i)=>{
    const d=document.createElement('div');d.className='slide';d.dataset.i=i;
    stage.appendChild(d);
  });
  const dust=document.createElement('div');dust.id='dust';let ds='';
  for(let i=0;i<26;i++){const l=(Math.random()*100).toFixed(1),s=(2+Math.random()*3.6).toFixed(1),
    d=(9+Math.random()*9).toFixed(1),dl=(-Math.random()*18).toFixed(1);
    ds+=`<span style="left:${l}%;width:${s}px;height:${s}px;animation-duration:${d}s;animation-delay:${dl}s"></span>`;}
  dust.innerHTML=ds;stage.appendChild(dust);
  document.getElementById('count').textContent=pad(1)+' / '+pad(SLIDES.length);
  show(0);
}
function pad(n){return String(n).padStart(2,'0');}
function show(n){
  idx=Math.max(0,Math.min(SLIDES.length-1,n));
  syncHydration(idx);
  [...stage.children].forEach(c=>c.classList.remove('on'));
  stage.children[idx].classList.add('on');
  document.getElementById('progbar').style.width=((idx+1)/SLIDES.length*100)+'%';
  document.getElementById('count').textContent=pad(idx+1)+' / '+pad(SLIDES.length);
  document.getElementById('sec').textContent=(SLIDES[idx].sec||'');
  updDbg();updSide();
}
function go(d){show(idx+d);}
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(1);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
  if(e.key.toLowerCase()==='d')toggleDbg();
  if(e.key.toLowerCase()==='r')toggleSide('rot');
  if(e.key.toLowerCase()==='p')toggleSide('pmt');
  if(e.key.toLowerCase()==='f')toggleFS();
  if(e.key==='Escape'){closeSide();closeDbg();}
  if(e.key==='Home')show(0); if(e.key==='End')show(SLIDES.length-1);
});
/* navegacao por deslize (celular) */
(function(){
  const app=document.getElementById('app');
  let x0=null,y0=null,t0=0;
  app.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){x0=null;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
  },{passive:true});
  app.addEventListener('touchend',function(e){
    if(x0===null)return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    x0=null;
    if(Date.now()-t0>700)return;
    if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.6)return;
    go(dx<0?1:-1);
  },{passive:true});
})();
window.addEventListener('orientationchange',function(){setTimeout(fit,260);});
let pseudoFS=false;
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement||null;}
function fsActive(){return !!fsEl()||pseudoFS;}
function updateFS(){
  const b=document.getElementById('fsBtnHud');
  const active=fsActive();
  if(b)b.textContent=active?'⛶ Sair da tela cheia (F)':'⛶ Tela cheia (F)';
  document.body.classList.toggle('fsmode',active);
  fit();
}
function toggleFS(){
  const el=document.documentElement;
  const reqFn=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  const exitFn=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
  if(!fsActive()){
    let pediu=false;
    if(reqFn){
      try{
        const p=reqFn.call(el);
        pediu=true;
        if(p&&p.catch)p.catch(function(){pseudoFS=true;updateFS();});
      }catch(err){pediu=false;}
    }
    if(!pediu){pseudoFS=true;}
    else{
      /* iOS, webviews e iframes sem permissao nao entram em tela cheia E
         tambem nao rejeitam a promessa: sem esta conferencia o botao
         simplesmente nao fazia nada. */
      setTimeout(function(){
        if(!fsEl()&&!pseudoFS){pseudoFS=true;updateFS();}
      },350);
    }
  }else{
    if(fsEl()&&exitFn){try{exitFn.call(document);}catch(err){}}
    pseudoFS=false;
  }
  updateFS();
}
document.addEventListener('fullscreenchange',updateFS);
document.addEventListener('webkitfullscreenchange',updateFS);
/* sidebar roteiro/prompt */
let sideMode='rot';
function toggleSide(mode){
  const el=document.getElementById('side');
  if(el.classList.contains('on')&&sideMode===mode){el.classList.remove('on');fit();return;}
  sideMode=mode;el.classList.add('on');updSide();fit();
}
function setSide(mode){sideMode=mode;updSide();}
function closeSide(){document.getElementById('side').classList.remove('on');fit();}
function closeDbg(){document.getElementById('dbg').classList.remove('on');fit();}
function updSide(){
  const el=document.getElementById('side');if(!el.classList.contains('on'))return;
  document.getElementById('tabRot').classList.toggle('act',sideMode==='rot');
  document.getElementById('tabPmt').classList.toggle('act',sideMode==='pmt');
  const n=idx+1,b=document.getElementById('sbody');
  if(sideMode==='rot'){
    b.innerHTML=`<div class="stitle">ROTEIRO OCULTO · SLIDE ${pad(n)} · ${SLIDES[idx].sec||''}</div><div class="stext">${FALAS[n]||'—'}</div>`;
  }else{
    const p=PROMPTS[n]||'—';
    b.innerHTML=`<div class="stitle">PROMPT DO SLIDE ${pad(n)} (BASE FASE 1 → GPT)</div>
      <div class="sbase"><b style="color:var(--gold)">BASE:</b> ${PROMPT_BASE}</div>
      <div class="stext">${p}</div>
      <button class="copyBtn" onclick="copyPrompt()">⧉ Copiar prompt completo</button>`;
  }
}
function copyPrompt(){
  const n=idx+1;const full=PROMPT_BASE+"\n\nSLIDE "+pad(n)+" · "+(SLIDES[idx].sec||'')+":\n"+(PROMPTS[n]||'');
  navigator.clipboard.writeText(full).then(()=>{
    const bt=document.querySelector('#side .copyBtn');if(bt){bt.textContent='✓ Copiado!';setTimeout(()=>bt.textContent='⧉ Copiar prompt completo',1500);}
  });
}
/* debug */
function toggleDbg(){document.getElementById('dbg').classList.toggle('on');updDbg();fit();}
function updDbg(){
  const el=document.getElementById('dbg');if(!el.classList.contains('on'))return;
  const s=SLIDES[idx];const dg=s.dbg||{};
  const st=(dg.status||'').toLowerCase();
  const bcls=st.includes('defin')?'b-def':st.includes('neces')||st.includes('falt')?'b-need':'b-ph';
  document.getElementById('dbgBody').innerHTML=`<div class="kick" style="color:#9fb2cc">SLIDE ${pad(idx+1)} · ${s.sec||''}</div>
    <h3>Objetivo estratégico</h3><div class="v">${dg.obj||'—'}</div>
    <h3>Emoção</h3><div class="v">${dg.emo||'—'}</div>
    <h3>Gatilhos</h3><div class="v">${(dg.gat||[]).map(g=>`<span class="badge b-ph">${g}</span>`).join('')||'—'}</div>
    <h3>Imagem utilizada</h3><div class="v">${s.photo||s.need||(s.concept?('conceitual: '+s.concept):'—')}</div>
    <h3>Origem</h3><div class="v">${dg.origem||(s.photo?'Fotos Dany':s.need?'A produzir':'Conceitual/placeholder')}</div>
    <h3>Status</h3><div class="v"><span class="badge ${bcls}">${dg.status||'Placeholder'}</span></div>
    <h3>Observações</h3><div class="v">${dg.obs||'—'}</div>`;
}
function fit(){
  const app=document.getElementById('app');
  const fs=fsActive();
  const w=app.clientWidth,h=app.clientHeight;
  const vPad=fs?24:84;
  const s=Math.max(.12,Math.min((w-32)/1280,(h-vPad)/720));
  document.getElementById('stageWrap').style.transform='scale('+s+')';
}
window.addEventListener('resize',fit);
document.getElementById('side').addEventListener('transitionend',e=>{if(e.propertyName==='width')fit();});
document.getElementById('dbg').addEventListener('transitionend',e=>{if(e.propertyName==='width')fit();});
build();fit();
/* Modo de exportacao pra PDF de backup: ?export=1 hidrata TODOS os slides de uma vez
   (fora da janela normal de virtualizacao HYD_WIN) e empilha em coluna pra impressao. */
if(new URLSearchParams(location.search).get('export')==='1'){
  document.body.classList.add('pw-ok','printExport');
  for(let i=0;i<SLIDES.length;i++)hydrate(i);
  /* o conteudo interno de cada slide (h1, bullets etc) so fica visivel via
     animacoes disparadas por seletores ".slide.on X". Sem isso, todo slide
     que nao for o atual fica com opacity:0 e imprime em branco. */
  [...document.querySelectorAll('.slide')].forEach(d=>d.classList.add('on'));
  document.title='EXPORT-READY · '+SLIDES.length+' slides';
}
</script>
